name: toolbandit-biasbusters

x-api: &api
  build: .
  restart: on-failure
  environment: &api-environment
    PYTHONUNBUFFERED: "1"
    OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
    EMBEDDING_DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_embeddings
    TOOLBANDIT_HOST: 0.0.0.0
    TOOLBANDIT_PORT: 8080
    TOOLBANDIT_COVARIANCE: diagonal
    TOOL_COST_SCALE: ${TOOL_COST_SCALE:-0.012}
    TOOL_LATENCY_SCALE: ${TOOL_LATENCY_SCALE:-3.0}
    TOOL_COST_WEIGHT: ${TOOL_COST_WEIGHT:-0.5}
    TOOL_LATENCY_WEIGHT: ${TOOL_LATENCY_WEIGHT:-0.5}
    TOOLBANDIT_ALPHA: ${TOOLBANDIT_ALPHA:-0.35}
    LQM_LATENCY_REFERENCE: ${LQM_LATENCY_REFERENCE:-3.0}
    LQM_DEFLATION: ${LQM_DEFLATION:-1.0}
  depends_on:
    postgres: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: toolbandit
      POSTGRES_USER: toolbandit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - toolbandit_biasbusters_postgres:/var/lib/postgresql/data
      - ./docker/postgres-biasbusters-init.sql:/docker-entrypoint-initdb.d/10-biasbusters.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbandit -d toolbandit"]
      interval: 5s
      timeout: 3s
      retries: 30

  api-ucb:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_ucb
    ports: ["8100:8080"]

  api-lqm:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_lqm
    ports: ["8101:8080"]

  api-semantic:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_semantic
    ports: ["8102:8080"]

  api-random:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_random
    ports: ["8103:8080"]

  api-cheapest:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_cheapest
    ports: ["8104:8080"]

  api-fastest:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_fastest
    ports: ["8105:8080"]

  api-passrate:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_passrate
    ports: ["8106:8080"]

  api-oracle:
    <<: *api
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit_oracle
    ports: ["8107:8080"]

volumes:
  toolbandit_biasbusters_postgres:
