services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: toolbandit
      POSTGRES_USER: toolbandit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - toolbandit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbandit -d toolbandit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://toolbandit:${POSTGRES_PASSWORD}@postgres:5432/toolbandit
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      TOOLBANDIT_HOST: 0.0.0.0
      TOOLBANDIT_PORT: 8080
      TOOLBANDIT_COVARIANCE: ${TOOLBANDIT_COVARIANCE:-diagonal}
      TOOL_COST_SCALE: ${TOOL_COST_SCALE:-0.012}
      TOOL_LATENCY_SCALE: ${TOOL_LATENCY_SCALE:-3.0}
    ports:
      - "${TOOLBANDIT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  toolbandit_postgres:
